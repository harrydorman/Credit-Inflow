kind = "web"
previewPath = "/"
title = "Credit Intelligence Dashboard"
version = "1.0.0"
id = "artifacts/credit-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18858

[services.development]
run = "pnpm --filter @workspace/credit-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/credit-dashboard", "run", "build" ]
publicDir = "artifacts/credit-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18858"
BASE_PATH = "/"
