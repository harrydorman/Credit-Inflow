openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: Credit Intelligence Dashboard API — Real-time credit risk detection and trade signal platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: articles
    description: News article operations
  - name: signals
    description: Credit signal aggregations
  - name: issuers
    description: Issuer-level intelligence
  - name: trends
    description: Trend detection and cluster analysis
  - name: ingestion
    description: Data ingestion operations
  - name: watchlists
    description: Watchlist management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List all processed articles
      parameters:
        - name: sector
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: sentiment
          in: query
          required: false
          schema:
            type: string
        - name: issuerName
          in: query
          required: false
          schema:
            type: string
        - name: covenantFlag
          in: query
          required: false
          schema:
            type: boolean
        - name: marketImpact
          in: query
          required: false
          schema:
            type: string
        - name: minUrgency
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleList"

  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get article detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /signals:
    get:
      operationId: getSignals
      tags: [signals]
      summary: Get aggregated credit signals by sector and event type
      responses:
        "200":
          description: Aggregated signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsResponse"

  /signals/daily-brief:
    get:
      operationId: getDailyBrief
      tags: [signals]
      summary: Get daily credit brief
      responses:
        "200":
          description: Daily credit brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBrief"

  /issuers:
    get:
      operationId: listIssuers
      tags: [issuers]
      summary: Get issuer-level credit intelligence
      description: Returns aggregated risk data per company/issuer including risk trajectory
      responses:
        "200":
          description: Issuer signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerList"

  /issuer-thesis/{issuer}:
    get:
      operationId: getIssuerThesis
      tags: [issuers]
      summary: Get AI-generated credit thesis for an issuer
      parameters:
        - name: issuer
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Credit thesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerThesis"
        "404":
          description: No data for issuer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trends:
    get:
      operationId: getTrends
      tags: [trends]
      summary: Get detected credit trend alerts with multi-timeframe analysis
      parameters:
        - name: windowHours
          in: query
          required: false
          schema:
            type: integer
            default: 72
      responses:
        "200":
          description: Trend alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendAlertsResponse"

  /market-overview:
    get:
      operationId: getMarketOverview
      tags: [signals]
      summary: Get top-down market overview for homepage
      responses:
        "200":
          description: Market overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverview"

  /trends/debug:
    get:
      operationId: getTrendsDebug
      tags: [trends]
      summary: Debug visibility into why trends are or are not being detected
      responses:
        "200":
          description: Debug data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendsDebug"

  /refresh:
    post:
      operationId: triggerRefresh
      tags: [ingestion]
      summary: Trigger data ingestion and AI processing
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResult"

  /watchlists:
    get:
      operationId: listWatchlists
      tags: [watchlists]
      summary: List all watchlists
      responses:
        "200":
          description: List of watchlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistList"
    post:
      operationId: createWatchlist
      tags: [watchlists]
      summary: Create a new watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchlistRequest"
      responses:
        "201":
          description: Watchlist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watchlist"

  /watchlists/{id}/items:
    post:
      operationId: addWatchlistItem
      tags: [watchlists]
      summary: Add an issuer to a watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchlistItemRequest"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "404":
          description: Watchlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Issuer already in watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /watchlists/{id}/items/{issuerName}:
    delete:
      operationId: removeWatchlistItem
      tags: [watchlists]
      summary: Remove an issuer from a watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: issuerName
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Item removed
        "404":
          description: Watchlist or item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /watchlists/{id}/articles:
    get:
      operationId: getWatchlistArticles
      tags: [watchlists]
      summary: Get recent articles for issuers in a watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Articles for watchlist issuers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleList"
        "404":
          description: Watchlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        source:
          type: string
        publishedAt:
          type: string
          format: date-time
        url:
          type: string
        rawContent:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        eventType:
          type: ["string", "null"]
        sentiment:
          type: ["string", "null"]
        whyItMatters:
          type: ["string", "null"]
        whoCares:
          type: ["string", "null"]
        cloImpact:
          type: boolean
        issuerName:
          type: ["string", "null"]
        urgencyScore:
          type: ["integer", "null"]
        covenantFlag:
          type: boolean
        ratingMentioned:
          type: ["string", "null"]
        ratingAgency:
          type: ["string", "null"]
        marketImpact:
          type: ["string", "null"]
        # Phase 2 scoring
        finalUrgencyScore:
          type: ["integer", "null"]
        creditSignalScore:
          type: ["integer", "null"]
        # Trade implication
        tradeDirection:
          type: ["string", "null"]
        tradeRationale:
          type: ["string", "null"]
        potentialTrades:
          type: ["array", "null"]
          items:
            type: string
        marketsImpacted:
          type: ["array", "null"]
          items:
            type: string
        # Credit metrics
        leverageMentioned:
          type: boolean
        liquidityConcern:
          type: boolean
        refinancingRisk:
          type: boolean
        earningsMiss:
          type: boolean
        # Rating detail
        ratingIsDowngrade:
          type: boolean
        ratingIsUpgrade:
          type: boolean
        ratingIsCCCThreshold:
          type: boolean
        # Covenant detail
        covenantType:
          type: ["string", "null"]
        # CLO analysis
        cloRelevance:
          type: ["string", "null"]
        cloLoanVsBond:
          type: ["string", "null"]
        cloWarfImpact:
          type: ["string", "null"]
        cloCCCBucketRisk:
          type: boolean
        cloExplanation:
          type: ["string", "null"]
        cloImpactTypes:
          type: ["array", "null"]
          items:
            type: string
        # Market technical signals
        spreadWideningRisk:
          type: boolean
        forcedSellingRisk:
          type: boolean
        distressedRisk:
          type: boolean
        # Market validation layer
        stockMove1D:
          type: ["number", "null"]
          description: Issuer stock 1-day return %
        stockMove5D:
          type: ["number", "null"]
          description: Issuer stock 5-day return %
        hyETFMove:
          type: ["number", "null"]
          description: HYG ETF 1-day move %
        marketValidationSignal:
          type: ["string", "null"]
          enum: [confirmed, mixed, unconfirmed, null]
          description: "confirmed: news + market aligned; mixed: divergence; unconfirmed: no market data"
        confidenceScore:
          type: ["string", "null"]
          enum: [high, medium, low, null]
          description: Combined AI signal strength + market confirmation
        # Structured AI outputs
        creditSummaryJson:
          type: ["object", "null"]
          properties:
            situation:
              type: string
            creditDrivers:
              type: array
              items:
                type: string
            riskFactors:
              type: array
              items:
                type: string
            keyMetricsMentioned:
              type: array
              items:
                type: string
            bottomLine:
              type: string
        scoreExplanationJson:
          type: ["object", "null"]
          properties:
            creditRisk:
              type: string
            marketSignal:
              type: string
            cloImpact:
              type: string
        processedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - source
        - publishedAt
        - url
        - cloImpact
        - covenantFlag
        - leverageMentioned
        - liquidityConcern
        - refinancingRisk
        - earningsMiss
        - ratingIsDowngrade
        - ratingIsUpgrade
        - ratingIsCCCThreshold
        - cloCCCBucketRisk
        - spreadWideningRisk
        - forcedSellingRisk
        - distressedRisk
        - createdAt

    ArticleList:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        total:
          type: integer
      required:
        - articles
        - total

    SectorSignal:
      type: object
      properties:
        sector:
          type: string
        totalArticles:
          type: integer
        negativeCount:
          type: integer
        eventTypes:
          type: array
          items:
            type: string
        riskScore:
          type: number
        creditSignalScore:
          type: integer
      required:
        - sector
        - totalArticles
        - negativeCount
        - eventTypes
        - riskScore

    EventTypeSignal:
      type: object
      properties:
        eventType:
          type: string
        count:
          type: integer
        negativeCount:
          type: integer
        sectors:
          type: array
          items:
            type: string
      required:
        - eventType
        - count
        - negativeCount
        - sectors

    IssuerSignal:
      type: object
      properties:
        issuerName:
          type: string
        sector:
          type: ["string", "null"]
        totalArticles:
          type: integer
        negativeCount:
          type: integer
        covenantFlag:
          type: boolean
        maxUrgency:
          type: integer
        eventTypes:
          type: array
          items:
            type: string
        ratingMentioned:
          type: ["string", "null"]
        ratingAgency:
          type: ["string", "null"]
        marketImpact:
          type: ["string", "null"]
        latestArticleDate:
          type: string
          format: date-time
        riskScore:
          type: number
        riskTrend:
          type: string
          enum: [improving, stable, deteriorating]
        creditSignalTotal:
          type: integer
      required:
        - issuerName
        - totalArticles
        - negativeCount
        - covenantFlag
        - maxUrgency
        - eventTypes
        - latestArticleDate
        - riskScore
        - riskTrend
        - creditSignalTotal

    IssuerList:
      type: object
      properties:
        issuers:
          type: array
          items:
            $ref: "#/components/schemas/IssuerSignal"
        total:
          type: integer
      required:
        - issuers
        - total

    IssuerThesis:
      type: object
      properties:
        issuer:
          type: string
        creditView:
          type: string
          enum: [positive, negative, neutral]
        summary:
          type: string
        keyDrivers:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        potentialOutlook:
          type: string
        articleCount:
          type: integer
      required:
        - issuer
        - creditView
        - summary
        - keyDrivers
        - risks
        - potentialOutlook
        - articleCount

    TrendAlert:
      type: object
      properties:
        type:
          type: string
          enum: [sector_cluster, issuer_deterioration, refinancing_wave, downgrade_wave, emerging]
        sector:
          type: ["string", "null"]
        issuer:
          type: ["string", "null"]
        signal:
          type: string
        evidence:
          type: string
        implication:
          type: string
        articleCount:
          type: integer
        severity:
          type: string
          enum: [critical, high, moderate, watch]
        trendScore:
          type: integer
        trendStrength:
          type: string
          enum: [increasing, stable, weakening]
      required:
        - type
        - signal
        - evidence
        - implication
        - articleCount
        - severity
        - trendScore
        - trendStrength

    FallbackNarrative:
      type: object
      properties:
        summary:
          type: string
        sectorsToWatch:
          type: array
          items:
            type: string
        reasoning:
          type: string
      required:
        - summary
        - sectorsToWatch
        - reasoning

    TrendAlertsResponse:
      type: object
      properties:
        trendAlerts:
          type: array
          items:
            $ref: "#/components/schemas/TrendAlert"
        hardAlerts:
          type: array
          items:
            $ref: "#/components/schemas/TrendAlert"
        emergingAlerts:
          type: array
          items:
            $ref: "#/components/schemas/TrendAlert"
        fallbackNarrative:
          oneOf:
            - $ref: "#/components/schemas/FallbackNarrative"
            - type: "null"
        total:
          type: integer
        windowHours:
          type: integer
        articlesAnalyzed:
          type: integer
      required:
        - trendAlerts
        - hardAlerts
        - emergingAlerts
        - total
        - windowHours
        - articlesAnalyzed

    TrendsDebug:
      type: object
      properties:
        articlesAnalyzed:
          type: integer
        articlesLast24h:
          type: integer
        articlesLast72h:
          type: integer
        sectorCounts:
          type: object
          additionalProperties:
            type: integer
        eventTypeCounts:
          type: object
          additionalProperties:
            type: integer
        negativeSentimentCounts:
          type: object
          additionalProperties:
            type: integer
      required:
        - articlesAnalyzed
        - articlesLast24h
        - articlesLast72h
        - sectorCounts
        - eventTypeCounts
        - negativeSentimentCounts

    SignalsResponse:
      type: object
      properties:
        bySector:
          type: array
          items:
            $ref: "#/components/schemas/SectorSignal"
        byEventType:
          type: array
          items:
            $ref: "#/components/schemas/EventTypeSignal"
        totalArticles:
          type: integer
        lastUpdated:
          type: ["string", "null"]
          format: date-time
      required:
        - bySector
        - byEventType
        - totalArticles

    DailyBriefItem:
      type: object
      properties:
        articleId:
          type: integer
        title:
          type: string
        summary:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        sentiment:
          type: ["string", "null"]
        eventType:
          type: ["string", "null"]
        issuerName:
          type: ["string", "null"]
        urgencyScore:
          type: ["integer", "null"]
        finalUrgencyScore:
          type: ["integer", "null"]
        covenantFlag:
          type: boolean
        ratingMentioned:
          type: ["string", "null"]
        ratingAgency:
          type: ["string", "null"]
        marketImpact:
          type: ["string", "null"]
        tradeDirection:
          type: ["string", "null"]
        spreadWideningRisk:
          type: boolean
      required:
        - articleId
        - title
        - covenantFlag

    DailyBrief:
      type: object
      properties:
        date:
          type: string
        mostNegativeEvents:
          type: array
          items:
            $ref: "#/components/schemas/DailyBriefItem"
        mostImpactedSectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorSignal"
        keyTrends:
          type: array
          items:
            type: string
        cloAlerts:
          type: array
          items:
            $ref: "#/components/schemas/DailyBriefItem"
        covenantAlerts:
          type: array
          items:
            $ref: "#/components/schemas/DailyBriefItem"
        criticalAlerts:
          type: array
          items:
            $ref: "#/components/schemas/DailyBriefItem"
        totalArticlesProcessed:
          type: integer
      required:
        - date
        - mostNegativeEvents
        - mostImpactedSectors
        - keyTrends
        - cloAlerts
        - covenantAlerts
        - criticalAlerts
        - totalArticlesProcessed

    MarketOverview:
      type: object
      properties:
        macro:
          type: object
          properties:
            hyETF:
              type: ["number", "null"]
            igETF:
              type: ["number", "null"]
            marketDirection:
              type: string
            hyETFLastClose:
              type: ["number", "null"]
            lqdLastClose:
              type: ["number", "null"]
          required: [marketDirection]
        riskSummary:
          type: object
          properties:
            overallCondition:
              type: string
              enum: [stable, deteriorating]
            negativeSignals:
              type: integer
            downgrades:
              type: integer
            covenantFlags:
              type: integer
            urgentArticles:
              type: integer
            totalArticles72h:
              type: integer
            processedArticles:
              type: integer
          required: [overallCondition, negativeSignals, downgrades, covenantFlags, urgentArticles, totalArticles72h, processedArticles]
        topRisks:
          type: array
          items:
            type: object
            properties:
              sector:
                type: string
              negativeCount:
                type: integer
              articleCount:
                type: integer
              avgUrgency:
                type: integer
              hasDowngrade:
                type: boolean
              hasCovenant:
                type: boolean
              reason:
                type: string
            required: [sector, negativeCount, articleCount, avgUrgency, hasDowngrade, hasCovenant, reason]
        trendHighlights:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              sector:
                type: ["string", "null"]
              issuer:
                type: ["string", "null"]
              signal:
                type: string
              severity:
                type: string
              trendStrength:
                type: string
            required: [type, signal, severity, trendStrength]
        sectorSignals:
          type: array
          items:
            type: object
            properties:
              sector:
                type: string
              totalArticles:
                type: integer
              negativeCount:
                type: integer
              avgUrgency:
                type: number
            required: [sector, totalArticles, negativeCount, avgUrgency]
        articleCounts:
          type: object
          properties:
            last24h:
              type: integer
            last72h:
              type: integer
          required: [last24h, last72h]
      required: [macro, riskSummary, topRisks, trendHighlights, sectorSignals, articleCounts]

    RefreshResult:
      type: object
      properties:
        fetched:
          type: integer
        processed:
          type: integer
        duplicatesSkipped:
          type: integer
        errors:
          type: integer
        message:
          type: string
      required:
        - fetched
        - processed
        - duplicatesSkipped
        - errors
        - message

    Watchlist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt

    WatchlistList:
      type: object
      properties:
        watchlists:
          type: array
          items:
            $ref: "#/components/schemas/Watchlist"
        total:
          type: integer
      required:
        - watchlists
        - total

    WatchlistItem:
      type: object
      properties:
        id:
          type: integer
        watchlistId:
          type: integer
        issuerName:
          type: string
        normalizedIssuerName:
          type: string
        addedAt:
          type: string
          format: date-time
      required:
        - id
        - watchlistId
        - issuerName
        - normalizedIssuerName
        - addedAt

    CreateWatchlistRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
      required:
        - name

    AddWatchlistItemRequest:
      type: object
      properties:
        issuerName:
          type: string
      required:
        - issuerName
