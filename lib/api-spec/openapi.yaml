openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: Credit Intelligence Dashboard API — Real-time credit risk detection and trade signal platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: articles
    description: News article operations
  - name: signals
    description: Credit signal aggregations
  - name: issuers
    description: Issuer-level intelligence
  - name: trends
    description: Trend detection and cluster analysis
  - name: ingestion
    description: Data ingestion operations
  - name: watchlists
    description: Watchlist management operations
  - name: alerts
    description: In-app alert rules and alert events
  - name: portfolios
    description: Portfolio management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List all processed articles
      parameters:
        - name: sector
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: sentiment
          in: query
          required: false
          schema:
            type: string
        - name: issuerName
          in: query
          required: false
          schema:
            type: string
        - name: covenantFlag
          in: query
          required: false
          schema:
            type: boolean
        - name: marketImpact
          in: query
          required: false
          schema:
            type: string
        - name: minUrgency
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleList"

  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get article detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /signals:
    get:
      operationId: getSignals
      tags: [signals]
      summary: Get aggregated credit signals by sector and event type
      responses:
        "200":
          description: Aggregated signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsResponse"

  /signals/daily-brief:
    get:
      operationId: getDailyBrief
      tags: [signals]
      summary: Get daily credit brief
      responses:
        "200":
          description: Daily credit brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBrief"

  /issuers:
    get:
      operationId: listIssuers
      tags: [issuers]
      summary: Get issuer-level credit intelligence
      description: Returns aggregated risk data per company/issuer including risk trajectory
      responses:
        "200":
          description: Issuer signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerList"

  /issuer-thesis/{issuer}:
    get:
      operationId: getIssuerThesis
      tags: [issuers]
      summary: Get AI-generated credit thesis for an issuer
      parameters:
        - name: issuer
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Credit thesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerThesis"
        "404":
          description: No data for issuer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trends:
    get:
      operationId: getTrends
      tags: [trends]
      summary: Get detected credit trend alerts with multi-timeframe analysis
      parameters:
        - name: windowHours
          in: query
          required: false
          schema:
            type: integer
            default: 72
      responses:
        "200":
          description: Trend alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendAlertsResponse"

  /market-overview:
    get:
      operationId: getMarketOverview
      tags: [signals]
      summary: Get top-down market overview for homepage
      responses:
        "200":
          description: Market overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketOverview"

  /trends/debug:
    get:
      operationId: getTrendsDebug
      tags: [trends]
      summary: Debug visibility into why trends are or are not being detected
      responses:
        "200":
          description: Debug data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendsDebug"

  /refresh:
    post:
      operationId: triggerRefresh
      tags: [ingestion]
      summary: Trigger data ingestion and AI processing
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResult"

  /watchlists:
    get:
      operationId: listWatchlists
      tags: [watchlists]
      summary: List all watchlists
      responses:
        "200":
          description: List of watchlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistList"
    post:
      operationId: createWatchlist
      tags: [watchlists]
      summary: Create a new watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchlistRequest"
      responses:
        "201":
          description: Watchlist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watchlist"

  /watchlists/{id}/items:
    get:
      operationId: getWatchlistItems
      tags: [watchlists]
      summary: Get all items (issuers) in a watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Items in watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItemList"
        "404":
          description: Watchlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addWatchlistItem
      tags: [watchlists]
      summary: Add an issuer to a watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchlistItemRequest"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "404":
          description: Watchlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Issuer already in watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /watchlists/{id}/items/{issuerName}:
    delete:
      operationId: removeWatchlistItem
      tags: [watchlists]
      summary: Remove an issuer from a watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: issuerName
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Item removed
        "404":
          description: Watchlist or item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /watchlists/{id}/articles:
    get:
      operationId: getWatchlistArticles
      tags: [watchlists]
      summary: Get recent articles for issuers in a watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Articles for watchlist issuers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleList"
        "404":
          description: Watchlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /alerts:
    get:
      operationId: listAlertEvents
      tags: [alerts]
      summary: List triggered alert events, newest first
      parameters:
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
        - name: watchlistId
          in: query
          required: false
          schema:
            type: integer
        - name: isRead
          in: query
          required: false
          schema:
            type: boolean
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [high, medium, low]
        - name: issuerName
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: portfolioLinked
          in: query
          required: false
          schema:
            type: boolean
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of alert events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventList"

  /alerts/rules:
    get:
      operationId: listAlertRules
      tags: [alerts]
      summary: List all alert rules
      parameters:
        - name: watchlistId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of alert rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleList"
    post:
      operationId: createAlertRule
      tags: [alerts]
      summary: Create a new alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertRuleRequest"
      responses:
        "201":
          description: Alert rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Watchlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/rules/{id}/toggle:
    post:
      operationId: toggleAlertRule
      tags: [alerts]
      summary: Toggle the isActive status of an alert rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert rule with updated isActive status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "404":
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/rules/{id}:
    patch:
      operationId: updateAlertRule
      tags: [alerts]
      summary: Update an existing alert rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertRuleRequest"
      responses:
        "200":
          description: Updated alert rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAlertRule
      tags: [alerts]
      summary: Delete an alert rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Alert rule deleted
        "404":
          description: Alert rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/bulk-read:
    post:
      operationId: bulkMarkAlertsRead
      tags: [alerts]
      summary: Bulk mark alert events as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMarkReadRequest"
      responses:
        "200":
          description: Number of alerts marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkMarkReadResult"

  /alerts/{id}/read:
    post:
      operationId: markAlertRead
      tags: [alerts]
      summary: Mark an alert event as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert event marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEvent"
        "404":
          description: Alert event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/{id}/unread:
    post:
      operationId: markAlertUnread
      tags: [alerts]
      summary: Mark an alert event as unread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert event marked as unread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEvent"
        "404":
          description: Alert event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/{id}/feedback:
    post:
      operationId: submitAlertFeedback
      tags: [alerts]
      summary: Submit usefulness feedback for an alert event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertFeedbackRequest"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertFeedback"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Alert event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolios:
    get:
      operationId: listPortfolios
      tags: [portfolios]
      summary: List portfolios for an organization
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of portfolios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioList"
        "400":
          description: Missing organizationId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createPortfolio
      tags: [portfolios]
      summary: Create a new portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
      responses:
        "201":
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolios/{id}:
    get:
      operationId: getPortfolioDetails
      tags: [portfolios]
      summary: Get detailed view of a single portfolio (org-safe)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Portfolio detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioDetail"
        "400":
          description: Missing organizationId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePortfolio
      tags: [portfolios]
      summary: Delete a portfolio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Portfolio deleted
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolios/{id}/holdings:
    get:
      operationId: listPortfolioHoldings
      tags: [portfolios]
      summary: List holdings for a portfolio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of portfolio holdings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioHoldingList"

  /portfolios/{id}/holdings/csv:
    post:
      operationId: ingestPortfolioCSV
      tags: [portfolios]
      summary: Ingest CSV holdings into a portfolio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv:
                  type: string
              required:
                - csv
      responses:
        "200":
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioIngestionResult"
        "400":
          description: Invalid portfolio id or missing csv
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portfolios/{id}/exposure-alerts:
    get:
      operationId: getPortfolioExposureAlerts
      tags: [portfolios]
      summary: Get alert events grouped by issuer for portfolio exposure
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Grouped exposure alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioExposureAlertList"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        source:
          type: string
        publishedAt:
          type: string
          format: date-time
        url:
          type: string
        rawContent:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        eventType:
          type: ["string", "null"]
        sentiment:
          type: ["string", "null"]
        whyItMatters:
          type: ["string", "null"]
        whoCares:
          type: ["string", "null"]
        cloImpact:
          type: boolean
        issuerName:
          type: ["string", "null"]
        urgencyScore:
          type: ["integer", "null"]
        covenantFlag:
          type: boolean
        ratingMentioned:
          type: ["string", "null"]
        ratingAgency:
          type: ["string", "null"]
        marketImpact:
          type: ["string", "null"]
        # Phase 2 scoring
        finalUrgencyScore:
          type: ["integer", "null"]
        creditSignalScore:
          type: ["integer", "null"]
        # Trade implication
        tradeDirection:
          type: ["string", "null"]
        tradeRationale:
          type: ["string", "null"]
        potentialTrades:
          type: ["array", "null"]
          items:
            type: string
        marketsImpacted:
          type: ["array", "null"]
          items:
            type: string
        # Credit metrics
        leverageMentioned:
          type: boolean
        liquidityConcern:
          type: boolean
        refinancingRisk:
          type: boolean
        earningsMiss:
          type: boolean
        # Rating detail
        ratingIsDowngrade:
          type: boolean
        ratingIsUpgrade:
          type: boolean
        ratingIsCCCThreshold:
          type: boolean
        # Covenant detail
        covenantType:
          type: ["string", "null"]
        # CLO analysis
        cloRelevance:
          type: ["string", "null"]
        cloLoanVsBond:
          type: ["string", "null"]
        cloWarfImpact:
          type: ["string", "null"]
        cloCCCBucketRisk:
          type: boolean
        cloExplanation:
          type: ["string", "null"]
        cloImpactTypes:
          type: ["array", "null"]
          items:
            type: string
        # Market technical signals
        spreadWideningRisk:
          type: boolean
        forcedSellingRisk:
          type: boolean
        distressedRisk:
          type: boolean
        # Market validation layer
        stockMove1D:
          type: ["number", "null"]
          description: Issuer stock 1-day return %
        stockMove5D:
          type: ["number", "null"]
          description: Issuer stock 5-day return %
        hyETFMove:
          type: ["number", "null"]
          description: HYG ETF 1-day move %
        marketValidationSignal:
          type: ["string", "null"]
          enum: [confirmed, mixed, unconfirmed, null]
          description: "confirmed: news + market aligned; mixed: divergence; unconfirmed: no market data"
        confidenceScore:
          type: ["string", "null"]
          enum: [high, medium, low, null]
          description: Combined AI signal strength + market confirmation
        # Structured AI outputs
        creditSummaryJson:
          type: ["object", "null"]
          properties:
            situation:
              type: string
            creditDrivers:
              type: array
              items:
                type: string
            riskFactors:
              type: array
              items:
                type: string
            keyMetricsMentioned:
              type: array
              items:
                type: string
            bottomLine:
              type: string
        scoreExplanationJson:
          type: ["object", "null"]
          properties:
            creditRisk:
              type: string
            marketSignal:
              type: string
            cloImpact:
              type: string
        processedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - source
        - publishedAt
        - url
        - cloImpact
        - covenantFlag
        - leverageMentioned
        - liquidityConcern
        - refinancingRisk
        - earningsMiss
        - ratingIsDowngrade
        - ratingIsUpgrade
        - ratingIsCCCThreshold
        - cloCCCBucketRisk
        - spreadWideningRisk
        - forcedSellingRisk
        - distressedRisk
        - createdAt

    ArticleList:
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        total:
          type: integer
      required:
        - articles
        - total

    SectorSignal:
      type: object
      properties:
        sector:
          type: string
        totalArticles:
          type: integer
        negativeCount:
          type: integer
        eventTypes:
          type: array
          items:
            type: string
        riskScore:
          type: number
        creditSignalScore:
          type: integer
      required:
        - sector
        - totalArticles
        - negativeCount
        - eventTypes
        - riskScore

    EventTypeSignal:
      type: object
      properties:
        eventType:
          type: string
        count:
          type: integer
        negativeCount:
          type: integer
        sectors:
          type: array
          items:
            type: string
      required:
        - eventType
        - count
        - negativeCount
        - sectors

    IssuerSignal:
      type: object
      properties:
